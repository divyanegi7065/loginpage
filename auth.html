<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Sign Up</title>
    <!-- Google Fonts for a polished, human-crafted look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Fresh green accent for registration */
            --primary-hover: #059669;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.75rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        #alert-box {
            margin-top: 1rem;
            padding: 0.75rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .alert-error {
            background-color: #fee2e2;
            color: var(--error);
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="header">
            <h1>Create Account</h1>
            <p>Get started with your free account today.</p>
        </div>

        <form id="signup-form">
            <div class="input-group">
                <label for="signup-email">Email address</label>
                <input type="email" id="signup-email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="At least 6 characters" required>
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
            <div id="alert-box"></div>
        </form>

        <div class="footer-text">
            Already have an account? <a href="index.html">Sign in</a>
        </div>
    </div>

    <!-- Firebase SDK & Integration Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMkEGvvpnv7WHONKBnk0_BrKoVbyHnEAo",
            authDomain: "firstproj-dd611.firebaseapp.com",
            projectId: "firstproj-dd611",
            storageBucket: "firstproj-dd611.firebasestorage.app",
            messagingSenderId: "254587017475",
            appId: "1:254587017475:web:91bb04b62a234f99637136",
            measurementId: "G-KHS86FLKJ5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signup-form');
        const alertBox = document.getElementById('alert-box');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alertBox.className = 'alert-success';
                alertBox.textContent = 'Account created successfully! You can now sign in.';
                alertBox.style.display = 'block';
                signupForm.reset();
            } catch (error) {
                alertBox.className = 'alert-error';
                alertBox.textContent = error.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
